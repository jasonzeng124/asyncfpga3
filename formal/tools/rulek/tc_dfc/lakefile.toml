# Probe C-10e: the verified timing checker as a compiled executable.
# Core Lean only.  Formal/** here are VERBATIM copies of formal/lean's proved modules
# (sync.sh copies them, `sync.sh --check` fails on drift); Tcheck/** is this probe's code.
name = "tcheck"
defaultTargets = ["tcheck"]

[leanOptions]
autoImplicit = false

[[lean_lib]]
name = "Formal"
globs = ["Formal.+"]

[[lean_lib]]
name = "Tcheck"
globs = ["Tcheck.+"]

[[lean_exe]]
name = "tcheck"
root = "Main"
