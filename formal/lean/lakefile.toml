name = "formal"
defaultTargets = ["Formal"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[lean_lib]]
name = "Formal"
# Every module under Formal/ is built (and so claimed). Work in progress that
# does not check goes under Wip/, which is not built.
roots = ["Formal"]
globs = ["Formal", "Formal.+"]

[[lean_exe]]
name = "xaudit"
root = "Formal.Core.XAudit.Main"
