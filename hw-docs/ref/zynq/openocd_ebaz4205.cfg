# EBAZ4205 (Zynq-7010, xc7z010clg400-1) JTAG bring-up + PL bitstream load.
#
# Adapted from openxc7-src/prjxray/utils/openocd/board-digilent-pynqz1.cfg
# (PYNQ-Z1, Zynq-7020) -- the PL boundary-scan TAP and DAP structure are
# identical across the Zynq-7000 family; only the PL TAP's expected IDCODE
# changes per die. xc7z010's IDCODE is 0x03722093 (unmasked top nibble is a
# stepping/revision field -- see prjxray-db/zynq7/xc7z010clg400-1/part.yaml)
# which is already covered by the pynqz1.cfg list's 0x13722093 entry (same
# low 28 bits, different revision nibble), so xc7z010 boards should already
# match that TAP -- listed explicitly below anyway for clarity/robustness.
#
# Usage:
#   openocd -f zynq/openocd_ebaz4205.cfg
#   # in the openocd telnet/tcl console (localhost:4444):
#   init
#   targets.tcl0 or use: zynq.cpu0
#   pld load 0 build/gcd/gcd.bit          ; # load PL fabric over JTAG
#   zynqpl_reset_release zynq.cpu0        ; # release PL from reset via SLCR
#
# This brings up the PL fabric directly via the ARM debug-access port's SLCR
# register pokes (zynqpl_reset_release) -- it does NOT require the board's
# FSBL/u-boot/Linux boot chain to have run at all. No NAND or SD-card
# involvement; nothing about the board's existing boot flow is touched.
#
# ---- adapter -----------------------------------------------------------
# The block below assumes a generic FTDI-based JTAG cable (FT2232H/FT232H
# class, e.g. a Digilent HS1/HS2-alike or a bare FT2232H breakout) wired to
# the EBAZ4205's J8 header / DATA1 header JTAG pins (TCK=DATA1_15,
# TMS=DATA1_16, TDI=DATA1_19, TDO=DATA1_20 per community pinout -- verify
# against your board revision before wiring). Adjust ftdi_vid_pid and
# ftdi_layout_init for your actual adapter (run `lsusb` to find vid:pid; the
# layout_init bit pattern is adapter-board-specific -- the values below are
# the plain "just TCK/TDI/TDO/TMS, no extra signals" case and may need
# changing for adapters with reset/output-enable lines on other GPIOs).
interface ftdi
transport select jtag
ftdi_device_desc "Digilent Adept USB Device"
ftdi_vid_pid 0x0403 0x6010

ftdi_channel 0
ftdi_layout_init 0x0088 0x008b
adapter_khz 20000
reset_config none

# ---- TAPs / targets ------------------------------------------------------
set _CHIPNAME zynq
set _TARGETNAME $_CHIPNAME.cpu

jtag newtap zynq_pl bs -irlen 6 -ircapture 0x1 -irmask 0x03 \
    -expected-id 0x13722093 \
    -expected-id 0x03722093 \
    -expected-id 0x23727093 \
    -expected-id 0x03727093 \
    -expected-id 0x03736093

jtag newtap $_CHIPNAME dap -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x4ba00477

target create ${_TARGETNAME}0 cortex_a -chain-position $_CHIPNAME.dap \
    -coreid 0 -dbgbase 0x80090000
target create ${_TARGETNAME}1 cortex_a -chain-position $_CHIPNAME.dap \
    -coreid 1 -dbgbase 0x80092000
target smp ${_TARGETNAME}0 ${_TARGETNAME}1

${_TARGETNAME}0 configure -event reset-assert-post "cortex_a dbginit"
${_TARGETNAME}1 configure -event reset-assert-post "cortex_a dbginit"

pld device virtex2 zynq_pl.bs 1

set XC7_JSHUTDOWN 0x0d
set XC7_JPROGRAM 0x0b
set XC7_JSTART 0x0c
set XC7_BYPASS 0x3f

proc zynqpl_program {tap} {
	global XC7_JSHUTDOWN XC7_JPROGRAM XC7_JSTART XC7_BYPASS
	irscan $tap $XC7_JSHUTDOWN
	irscan $tap $XC7_JPROGRAM
	runtest 60000
	#JSTART prevents this from working...
	#irscan $tap $XC7_JSTART
	runtest 2000
	irscan $tap $XC7_BYPASS
	runtest 2000
}

proc zynqpl_reset_release {target} {
    # Unlock SLCR
    $target mww 0xf8000008 0xdf0d
    # Enable level shifters, both PL-PS and PS-PL
    $target mww 0xf8000900 0xF
    # Release FPGA reset
    $target mww 0xf8000240 0x0
    # Lock SLCR
    $target mww 0xf8000004 0x767b
}

# Set FCLK0 (the *_ps_top harnesses' AXI clock) to a defined rate instead
# of trusting whatever state the boot flow left. SRCSEL=IO PLL, DIVISOR0=
# 20, DIVISOR1=1: with the PLLs still in their power-on bypass (no FSBL
# ever ran) that is PS_CLK/20 = 1.67 MHz; if an FSBL DID lock the IO PLL
# at the usual 1 GHz it is 50 MHz. Both are fine -- the harness is a
# single-beat register slave and the 4-phase core doesn't care about the
# poke rate.
proc zynqpl_fclk0 {target} {
    $target mww 0xf8000008 0xdf0d
    $target mww 0xf8000170 0x00101400
    $target mww 0xf8000004 0x767b
}

# Driving a *_ps_top harness needs NO software on the PS at all: with the
# CPU halted, this same mww/mdw mechanism reaches any PS memory-mapped
# address -- including M_AXI_GP0 at 0x40000000, i.e. the harness register
# map -- as real AXI transactions issued through the halted core. Use the
# `phys` variant if a booted OS was halted (MMU on, virtual != physical).
# One gcd/knapsack call, after `init; halt; pld load 0 <bit>;
# zynqpl_reset_release zynq.cpu0; zynqpl_fclk0 zynq.cpu0`:
#
#   zynq.cpu0 mww phys 0x40000000 0x0      ;# clear rst (held high at PL reset)
#   zynq.cpu0 mww phys 0x40000008 <input>  ;# I_DATA
#   zynq.cpu0 mww phys 0x40000000 0x1      ;# CTRL.i_req=1
#   zynq.cpu0 mdw phys 0x40000004          ;# poll until STATUS[0]=i_ack=1
#   zynq.cpu0 mww phys 0x40000000 0x0      ;# i_req=0 (return-to-zero!)
#   zynq.cpu0 mdw phys 0x40000004          ;# poll until STATUS[1]=o_req=1
#   zynq.cpu0 mdw phys 0x4000000c          ;# O_DATA = result
#   zynq.cpu0 mww phys 0x40000000 0x2      ;# CTRL.o_ack=1
#   zynq.cpu0 mdw phys 0x40000004          ;# poll until o_req=0
#   zynq.cpu0 mww phys 0x40000000 0x0      ;# o_ack=0 -- RTZ complete
#
# The full return-to-zero on BOTH sides is mandatory (see CLAUDE.md's
# "single shot" gotcha: holding i_req or o_ack high deadlocks every
# while-ring after one traversal). Script this over the TCL port
# (localhost:6666) for golden-vector replay.
